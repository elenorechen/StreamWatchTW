name: 電腦版自動測試

on:
  push:
    branches: [ main ]
    paths: [ 'extension/**', 'scripts/extension-test.js', '.github/workflows/extension-test.yml' ]
  workflow_dispatch:

jobs:
  extension-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安裝測試用瀏覽器
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: 在 Chrome 裡測試擴充功能
        run: node scripts/extension-test.js ext-test-results

      - name: 上傳測試結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ext-test-results
          path: ext-test-results/
